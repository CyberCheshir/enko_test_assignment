name: task_4_clickhouse

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse-server
    ports:
      - "18123:8123"   # HTTP interface
      - "19000:9000"   # Native TCP client (9000 used by rustfs S3)
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./config.d/listen.xml:/etc/clickhouse-server/config.d/listen.xml:ro
    restart: unless-stopped
    networks:
      - data-platform_data-platform
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --query 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  clickhouse_data:
  clickhouse_logs:

networks:
  data-platform_data-platform:
    external: true
